set -g status-style "bg=default,fg=default"
set -g mode-style "bg=blue,fg=default"
set -g pane-active-border-style "#{?pane_in_mode,fg=blue,#{?synchronize-panes,fg=red,fg=magenta}}"

set -g extended-keys on
set -g extended-keys-format csi-u

set -g status-right ""

unbind C-b
set -g prefix M-\\
bind M-\\ send-prefix

unbind s
unbind v
bind s split-window -v -c "#{pane_current_path}"
bind v split-window -h -c "#{pane_current_path}"

bind e choose-tree -Z

set-window-option -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

bind -n M-H previous-window
bind -n M-L next-window

bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

bind -n M-< resize-pane -L 1
bind -n M-- resize-pane -D 1
bind -n M-+ resize-pane -U 1
bind -n M-> resize-pane -R 1

[general]
live_config_reload = false

[window]
padding = { x = 12, y = 20 }
decorations = "Buttonless"
opacity = 0.75
blur = true
option_as_alt = "Both"

[font]
normal = { family = "TX-02" }
size = 20

[colors.primary]
foreground = "#c0caf5"
background = "#1a1b26"

[colors.cursor]
text = "#1a1b26"
